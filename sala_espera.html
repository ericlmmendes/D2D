<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sala de Espera - CDC Barueri</title>
  <link rel="shortcut icon" href="./img/logo1.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f9fafb;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
    }
    th {
      background: #1e40af;
      color: white;
      font-weight: 600;
    }
    td {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    tbody tr:nth-child(even) td {
      background: #f9fafb;
    }
    tbody tr:hover td {
      background: #f1f5f9;
      transition: background 0.2s ease;
    }
    .header {
      background: linear-gradient(to right, #1e40af, #3b82f6);
      color: white;
      padding: 1rem 2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .logo {
      max-width: 200px;
      margin: 0 auto 2rem;
      display: block;
    }
    .notification {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 0.25rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .notification.standard {
      background: #fefcbf;
      border-left: 4px solid #d97706;
    }
    .notification.penalidade {
      background: #fee2e2;
      border-left: 4px solid #dc2626;
      color: #dc2626;
      font-weight: 600;
    }
    .penalidade-aplicada {
      color: #dc2626;
      font-weight: 600;
    }
    .express-load {
      color: #6b7280;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      th, td {
        padding: 0.5rem;
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="header">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <i class="fas fa-clock text-2xl"></i>
      <h1 class="text-2xl font-bold">Sala de Espera D2D - CDC Barueri</h1>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 mt-6">
    <img src="./img/logo1.ico" alt="CDC Barueri Logo" class="logo">
    <div class="bg-white rounded-xl shadow-lg p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-bell mr-2"></i>Notificações</h2>
      <div id="notificacoes" class="space-y-2"></div>
      <h2 class="text-lg font-semibold text-gray-800 mt-6 mb-4"><i class="fas fa-list mr-2"></i>Ordem de Chegada</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead>
            <tr>
              <th><i class="fas fa-user mr-1"></i>Motorista</th>
              <th><i class="fas fa-file-alt mr-1"></i>FMO</th>
              <th><i class="fas fa-truck mr-1"></i>Placa</th>
              <th><i class="fas fa-boxes mr-1"></i>Qtde. Sacas</th>
              <th><i class="fas fa-clock mr-1"></i>Data e Hora</th>
              <th><i class="fas fa-info-circle mr-1"></i>Status</th>
              <th><i class="fas fa-dolly-flatbed mr-1"></i>Doca</th>
            </tr>
          </thead>
          <tbody id="tabelaEspera"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { database, ref, onValue } from './firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      console.log("Firebase database:", database);
      console.log("Firebase ref:", ref);
      console.log("Firebase onValue:", onValue);

      const tabelaEspera = document.getElementById("tabelaEspera");
      const notificacoesDiv = document.getElementById("notificacoes");

      const STATUSES = {
        AGUARDANDO: "Aguardando",
        EM_DESCARGA: "Em Descarga",
        FINALIZADA: "Finalizadas"
      };
      const LEGACY_STATUSES = {
        AGUARDANDO: "Aguardando descarregamento",
        EM_DESCARGA: "Em descarga",
        FINALIZADA: "Descarga finalizada"
      };

      const normalizeStatus = (status) => {
        if (!status) return STATUSES.AGUARDANDO;
        if (status === LEGACY_STATUSES.AGUARDANDO || status === "Aguardando descarregamento") return STATUSES.AGUARDANDO;
        if (status === LEGACY_STATUSES.EM_DESCARGA || status === "Em descarga") return STATUSES.EM_DESCARGA;
        if (status === LEGACY_STATUSES.FINALIZADA || status === "Descarga finalizada") return STATUSES.FINALIZADA;
        return status;
      };

      function populateWaitingRoom() {
        console.log("Populando sala de espera...");
        onValue(ref(database, 'registrosFMO'), snapshot => {
          console.log("Dados recebidos do Firebase para sala de espera:", snapshot.val());
          tabelaEspera.innerHTML = "";
          const registros = snapshot.val();
          if (!registros) {
            console.log("Nenhum registro encontrado");
            tabelaEspera.innerHTML = '<tr><td colspan="7" class="text-center p-4">Nenhum motorista na sala de espera</td></tr>';
            return;
          }

          // Processar registros, aplicar lógica de Carga Express e filtrar status "Finalizadas"
          const registrosArray = Object.entries(registros)
            .map(([id, r]) => ({
              id,
              ...r,
              status: normalizeStatus(r.status || STATUSES.AGUARDANDO),
              quantidadeSacas: parseInt(r.quantidadeSacas || 0),
              isExpress: parseInt(r.quantidadeSacas || 0) <= 100
            }))
            .filter(r => r.status !== STATUSES.FINALIZADA) // Filtra "Finalizadas" apenas na visualização
            .sort((a, b) => new Date(a.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+)/, '$3-$2-$1 $4')) - new Date(b.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+)/, '$3-$2-$1 $4')));

          registrosArray.forEach(r => {
            console.log("Adicionando registro à sala de espera:", r);
            const row = tabelaEspera.insertRow();
            row.classList.add("border-b");
            const hasPenalidade = !!r.penalidade;
            const cells = [
              row.insertCell(0), // Motorista
              row.insertCell(1), // FMO
              row.insertCell(2), // Placa
              row.insertCell(3), // Qtde. Sacas
              row.insertCell(4), // Data e Hora
              row.insertCell(5), // Status
              row.insertCell(6)  // Doca
            ];
            cells[0].textContent = r.motorista || "Não informado";
            cells[1].textContent = r.fmo || "Não informado";
            cells[2].textContent = r.placa || "Não informado";
            cells[3].innerHTML = `${r.quantidadeSacas} ${r.isExpress ? '<span class="express-load">(Express)</span>' : ''}`;
            cells[4].textContent = r.dataHora || "Não informado";
            cells[5].textContent = r.status || STATUSES.AGUARDANDO;
            cells[6].textContent = r.docaSelecionada ? `Doca ${r.docaSelecionada}` : "Não atribuída";
            if (hasPenalidade) {
              cells.forEach(cell => cell.classList.add("penalidade-aplicada"));
            }
          });
        }, error => {
          console.error("Erro ao carregar registros:", error);
          tabelaEspera.innerHTML = '<tr><td colspan="7" class="text-center p-4">Erro ao carregar registros</td></tr>';
        });
      }

      function populateNotifications() {
        console.log("Populando notificações...");
        onValue(ref(database, 'notificacoesFMO'), snapshot => {
          console.log("Notificações recebidas do Firebase:", snapshot.val());
          notificacoesDiv.innerHTML = "";
          const notificacoes = snapshot.val();
          if (!notificacoes) {
            console.log("Nenhuma notificação encontrada");
            notificacoesDiv.innerHTML = '<p class="text-center text-gray-500">Nenhuma notificação no momento</p>';
            return;
          }

          // Obter a notificação mais recente por motorista
          const ultimasNotificacoes = [];
          Object.keys(notificacoes).forEach(id => {
            const notificacoesMotorista = notificacoes[id];
            const notificacoesArray = Object.entries(notificacoesMotorista).map(([notifId, notif]) => ({
              id,
              notifId,
              ...notif
            }));
            const maisRecente = notificacoesArray.sort((a, b) => 
              new Date(b.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+:\d+)/, '$3-$2-$1 $4')) - 
              new Date(a.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+:\d+)/, '$3-$2-$1 $4'))
            )[0];
            if (maisRecente) ultimasNotificacoes.push(maisRecente);
          });

          if (ultimasNotificacoes.length === 0) {
            notificacoesDiv.innerHTML = '<p class="text-center text-gray-500">Nenhuma notificação no momento</p>';
            return;
          }

          // Ordenar notificações por dataHora (mais recentes primeiro)
          ultimasNotificacoes.sort((a, b) => 
            new Date(b.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+:\d+)/, '$3-$2-$1 $4')) - 
            new Date(a.dataHora.replace(/(\d+)\/(\d+)\/(\d+), (\d+:\d+:\d+)/, '$3-$2-$1 $4'))
          );

          // Filtrar notificações para excluir aquelas de registros com status "Finalizadas"
          onValue(ref(database, 'registrosFMO'), registrosSnapshot => {
            const registros = registrosSnapshot.val() || {};
            ultimasNotificacoes.forEach(n => {
              const registro = registros[n.id];
              if (!registro || normalizeStatus(registro.status) !== STATUSES.FINALIZADA) {
                console.log("Adicionando notificação:", n);
                const div = document.createElement("div");
                div.classList.add("notification", n.tipo === "penalidade" ? "penalidade" : "standard");
                div.innerHTML = `
                  ${n.motorista || "Não informado"} (FMO: ${n.fmo || "Não informado"}, Placa: ${n.placa || "Não informado"})<br>
                  ${n.mensagem || `Status atualizado: ${n.status}`}<br>
                  ${n.dataHora || "Não informado"}
                `;
                notificacoesDiv.appendChild(div);
              }
            });
          }, { onlyOnce: true }, error => {
            console.error("Erro ao verificar registros para notificações:", error);
            notificacoesDiv.innerHTML = '<p class="text-center text-red-500">Erro ao carregar notificações</p>';
          });
        }, error => {
          console.error("Erro ao carregar notificações:", error);
          notificacoesDiv.innerHTML = '<p class="text-center text-red-500">Erro ao carregar notificações</p>';
        });
      }

      populateWaitingRoom();
      populateNotifications();
    });
  </script>
</body>
</html>
