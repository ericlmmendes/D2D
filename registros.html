<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body class="bg-gray-50 min-h-screen">
  <header class="header">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <i class="fas fa-clipboard text-2xl"></i>
      <h1 class="text-2xl font-semibold">Registros de FMO - CDC Barueri</h1>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 mt-6">
    <div class="bg-white rounded-xl shadow-lg p-6">
      <button id="btnRelatorioGeral" class="fixed-button bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2 font-medium">
        <i class="fas fa-file-export"></i> Enviar Relatório Geral
      </button>

      <div class="overflow-x-auto">
        <table class="min-w-full">
          <thead>
            <tr>
              <th><i class="fas fa-user fa-xs mr-1"></i> Motorista</th>
              <th><i class="fas fa-phone fa-xs mr-1"></i> Telefone</th>
              <th><i class="fas fa-file-alt fa-xs mr-1"></i> FMO</th>
              <th><i class="fas fa-truck fa-xs mr-1"></i> Placa</th>
              <th><i class="fas fa-clock fa-xs mr-1"></i> Data e Hora</th>
              <th><i class="fas fa-map-marker-alt fa-xs mr-1"></i> Local (CEP)</th>
              <th><i class="fas fa-image fa-xs mr-1"></i> Foto</th>
              <th><i class="fas fa-warehouse fa-xs mr-1"></i> Doca</th>
              <th><i class="fas fa-info-circle fa-xs mr-1"></i> Status</th>
              <th><i class="fas fa-bell fa-xs mr-1"></i> Notificar</th>
            </tr>
          </thead>
          <tbody id="tabelaRegistros"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 class="text-xl font-semibold text-gray-800 mb-4"><i class="fas fa-info-circle mr-2"></i>Detalhes do Registro</h3>
      <div id="modal-body" class="space-y-2 text-gray-700"></div>
      <button id="btnFecharModal" class="mt-4 bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition w-full font-medium"><i class="fas fa-times mr-2"></i>Fechar</button>
    </div>
  </div>

  <script type="module">
    import { database, ref, update, onValue, remove, push } from './firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      console.log("Firebase database:", database);
      console.log("Firebase ref:", ref);
      console.log("Firebase update:", update);
      console.log("Firebase onValue:", onValue);
      console.log("Firebase remove:", remove);
      console.log("Firebase push:", push);

      const tabela = document.getElementById("tabelaRegistros");
      const modal = document.getElementById("modal");
      const modalBody = document.getElementById("modal-body");
      const btnFecharModal = document.getElementById("btnFecharModal");
      const btnRelatorioGeral = document.getElementById("btnRelatorioGeral");
      const targetAddress = "Avenida Prefeito João Vilallobo Quero, Conjunto Habitacional Mirante dos Altos, Jardim Belval, Barueri, Região Imediata de São Paulo, Região Metropolitana de São Paulo, São Paulo, Região Sudeste, 06422-122, Brasil";

      const statuses = [
        "Aguardando descarregamento",
        "Em descarga",
        "Descarga finalizada"
      ];

      function extractCEP(address) {
        if (!address) return "Sem CEP";
        const match = address.match(/\d{5}-\d{3}/);
        return match ? match[0] : "Sem CEP";
      }

      function openModal(record) {
        console.log("Abrindo modal com registro:", record);
        modalBody.innerHTML = `
          <div class="grid grid-cols-1 gap-2">
            <p><strong class="font-medium"><i class="fas fa-user mr-1"></i>Motorista:</strong> ${record.motorista}</p>
            <p><strong class="font-medium"><i class="fas fa-phone mr-1"></i>Telefone:</strong> ${record.telefone}</p>
            <p><strong class="font-medium"><i class="fas fa-file-alt mr-1"></i>FMO:</strong> ${record.fmo}</p>
            <p><strong class="font-medium"><i class="fas fa-truck mr-1"></i>Placa:</strong> ${record.placa}</p>
            <p><strong class="font-medium"><i class="fas fa-clock mr-1"></i>Data e Hora:</strong> ${record.dataHora}</p>
            <p><strong class="font-medium"><i class="fas fa-map-marker-alt mr-1"></i>Endereço:</strong> ${record.enderecoCompleto || "Sem endereço"}</p>
            <img src="${record.imagem}" alt="Foto do registro" class="mt-2" />
          </div>
        `;
        modal.style.display = "flex";
      }

      function closeModal() {
        console.log("Fechando modal");
        modal.style.display = "none";
      }

      btnFecharModal.addEventListener('click', () => {
        console.log("Botão Fechar clicado");
        closeModal();
      });

      function trocaStatus(id, statusCell, btn) {
        console.log("Mudando status do registro:", id);
        onValue(ref(database, `registrosFMO/${id}`), snapshot => {
          const record = snapshot.val();
          let atual = record.status || statuses[0];
          let idx = statuses.indexOf(atual);
          if (idx < statuses.length - 1) {
            idx++;
            const newStatus = statuses[idx];
            const notificacao = {
              motorista: record.motorista,
              fmo: record.fmo,
              placa: record.placa,
              status: newStatus,
              dataHora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" })
            };
            Promise.all([
              update(ref(database, `registrosFMO/${id}`), { status: newStatus }),
              push(ref(database, `notificacoesFMO/${id}`), notificacao)
            ]).then(() => {
              statusCell.textContent = newStatus;
              if (idx === statuses.length - 1) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i>Status finalizado';
                btn.classList.add("bg-gray-400", "cursor-not-allowed");
              } else {
                btn.innerHTML = '<i class="fas fa-sync mr-1"></i>Mudar para: ' + statuses[idx + 1];
                btn.classList.remove("bg-gray-400", "cursor-not-allowed");
              }
              console.log("Status atualizado para:", newStatus);
              console.log("Notificação enviada:", notificacao);
            }).catch(error => {
              console.error("Erro ao atualizar status ou enviar notificação:", error);
              alert("Erro ao atualizar status: " + error.message);
            });
          }
        }, { onlyOnce: true }, error => {
          console.error("Erro ao buscar status:", error);
          alert("Erro ao buscar status: " + error.message);
        });
      }

      function populateTable() {
        console.log("Populando tabela...");
        tabela.innerHTML = "";
        onValue(ref(database, 'registrosFMO'), snapshot => {
          console.log("Dados recebidos do Firebase:", snapshot.val());
          tabela.innerHTML = "";
          const registros = snapshot.val();
          if (!registros) {
            console.log("Nenhum registro encontrado");
            tabela.innerHTML = '<tr><td colspan="10" class="text-center p-4">Nenhum registro encontrado</td></tr>';
            return;
          }

          Object.keys(registros).forEach((id, index) => {
            const r = { ...registros[id], id };
            console.log("Adicionando registro à tabela:", r);

            const row = tabela.insertRow();
            row.classList.add("border-b");

            const isValidAddress = r.enderecoCompleto === targetAddress;

            const motoristaCell = row.insertCell(0);
            motoristaCell.textContent = r.motorista;
            motoristaCell.classList.add(isValidAddress ? "valid-address" : "invalid-address");

            const telefoneCell = row.insertCell(1);
            telefoneCell.textContent = r.telefone;
            telefoneCell.classList.add(isValidAddress ? "valid-address" : "invalid-address");

            const fmoCell = row.insertCell(2);
            fmoCell.textContent = r.fmo;
            fmoCell.classList.add(isValidAddress ? "valid-address" : "invalid-address");

            const placaCell = row.insertCell(3);
            placaCell.textContent = r.placa;
            placaCell.classList.add(isValidAddress ? "valid-address" : "invalid-address");

            row.insertCell(4).textContent = r.dataHora;

            const localCell = row.insertCell(5);
            localCell.classList.add("p-3");
            if (r.enderecoCompleto) {
              localCell.innerHTML = `<span class="cep-link">${extractCEP(r.enderecoCompleto)}</span>`;
              localCell.querySelector(".cep-link").onclick = () => openModal(r);
            } else if (r.latitude && r.longitude) {
              localCell.innerHTML = `<span class="cep-link">Carregando...</span>`;
              fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${r.latitude}&lon=${r.longitude}`)
                .then(res => res.json())
                .then(data => {
                  const endereco = data.display_name;
                  update(ref(database, `registrosFMO/${id}`), { enderecoCompleto: endereco }).then(() => {
                    const cep = extractCEP(endereco);
                    localCell.innerHTML = `<span class="cep-link">${cep}</span>`;
                    localCell.querySelector(".cep-link").onclick = () => openModal(r);
                    const isValid = endereco === targetAddress;
                    motoristaCell.classList.add(isValid ? "valid-address" : "invalid-address");
                    telefoneCell.classList.add(isValid ? "valid-address" : "invalid-address");
                    fmoCell.classList.add(isValid ? "valid-address" : "invalid-address");
                    placaCell.classList.add(isValid ? "valid-address" : "invalid-address");
                    console.log("Endereço atualizado:", endereco);
                  }).catch(error => {
                    console.error("Erro ao atualizar endereço:", error);
                    localCell.innerHTML = `<span class="cep-link">Sem CEP</span>`;
                    localCell.querySelector(".cep-link").onclick = () => openModal(r);
                    motoristaCell.classList.add("invalid-address");
                    telefoneCell.classList.add("invalid-address");
                    fmoCell.classList.add("invalid-address");
                    placaCell.classList.add("invalid-address");
                  });
                })
                .catch(() => {
                  localCell.innerHTML = `<span class="cep-link">Sem CEP</span>`;
                  localCell.querySelector(".cep-link").onclick = () => openModal(r);
                  motoristaCell.classList.add("invalid-address");
                  telefoneCell.classList.add("invalid-address");
                  fmoCell.classList.add("invalid-address");
                  placaCell.classList.add("invalid-address");
                });
            } else {
              localCell.innerHTML = `<span class="cep-link">Sem CEP</span>`;
              localCell.querySelector(".cep-link").onclick = () => openModal(r);
              motoristaCell.classList.add("invalid-address");
              telefoneCell.classList.add("invalid-address");
              fmoCell.classList.add("invalid-address");
              placaCell.classList.add("invalid-address");
            }

            const imgCell = row.insertCell(6);
            const img = document.createElement("img");
            img.src = r.imagem;
            img.alt = "Foto";
            img.classList.add("table-img");
            imgCell.classList.add("p-3");
            imgCell.appendChild(img);

            const docaCell = row.insertCell(7);
            const select = document.createElement("select");
            select.classList.add("p-2", "border", "border-gray-300", "rounded-lg", "w-full", "bg-white", "focus:ring-2", "focus:ring-blue-500", "text-sm");
            ["", "10", "11", "12"].forEach(opt => {
              const option = document.createElement("option");
              option.value = opt;
              option.text = opt ? `Doca ${opt}` : "Selecionar";
              if (r.docaSelecionada === opt) option.selected = true;
              select.appendChild(option);
            });
            select.onchange = () => {
              console.log("Atualizando doca para:", select.value);
              const notificacao = {
                motorista: r.motorista,
                fmo: r.fmo,
                placa: r.placa,
                doca: select.value,
                mensagem: select.value ? `Você foi direcionado à Doca ${select.value}` : "Doca removida",
                dataHora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" })
              };
              Promise.all([
                update(ref(database, `registrosFMO/${id}`), { docaSelecionada: select.value }),
                push(ref(database, `notificacoesFMO/${id}`), notificacao)
              ]).catch(error => {
                console.error("Erro ao atualizar doca ou enviar notificação:", error);
                alert("Erro ao atualizar doca: " + error.message);
              });
            };
            docaCell.classList.add("p-3");
            docaCell.appendChild(select);

            const statusCell = row.insertCell(8);
            statusCell.classList.add("p-3");
            statusCell.textContent = r.status || statuses[0];

            const btnStatus = document.createElement("button");
            btnStatus.className = "status-btn bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition text-sm";
            let currentStatusIndex = statuses.indexOf(r.status || statuses[0]);
            btnStatus.innerHTML = currentStatusIndex === statuses.length - 1
              ? '<i class="fas fa-check-circle mr-1"></i>Status finalizado'
              : '<i class="fas fa-sync mr-1"></i>Mudar para: ' + statuses[currentStatusIndex + 1];
            if (currentStatusIndex === statuses.length - 1) {
              btnStatus.disabled = true;
              btnStatus.classList.add("bg-gray-400", "cursor-not-allowed");
            }
            btnStatus.onclick = () => trocaStatus(id, statusCell, btnStatus);
            statusCell.appendChild(document.createElement("br"));
            statusCell.appendChild(btnStatus);

            const notificarCell = row.insertCell(9);
            const btn = document.createElement("button");
            btn.className = "bg-green-600 text-white p-2 rounded-lg hover:bg-green-700 transition w-full text-sm";
            btn.innerHTML = '<i class="fas fa-bell mr-1"></i>Notificar';
            btn.onclick = () => {
              const docaSelecionada = select.value;
              if (!docaSelecionada) {
                alert("Selecione a doca antes de notificar.");
                return;
              }
              if (!r.placa) {
                alert("Placa do veículo não informada.");
                return;
              }

              console.log("Enviando notificação para:", r.motorista);
              const notificacao = {
                motorista: r.motorista,
                fmo: r.fmo,
                placa: r.placa,
                doca: docaSelecionada,
                mensagem: `Informe CDC Barueri: Dirija-se à Doca ${docaSelecionada}`,
                dataHora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" })
              };
              push(ref(database, `notificacoesFMO/${id}`), notificacao).then(() => {
                console.log("Notificação enviada:", notificacao);
                alert("Notificação enviada para a sala de espera!");
              }).catch(error => {
                console.error("Erro ao enviar notificação:", error);
                alert("Erro ao enviar notificação: " + error.message);
              });
            };
            notificarCell.classList.add("p-3");
            notificarCell.appendChild(btn);
          });
        }, error => {
          console.error("Erro ao carregar registros:", error);
          alert("Erro ao carregar registros: " + error.message);
        });
      }

      function enviarRelatorioGeral() {
        console.log("Iniciando geração do relatório geral...");
        onValue(ref(database, 'registrosFMO'), snapshot => {
          console.log("Dados do relatório recebidos:", snapshot.val());
          const registros = snapshot.val();
          if (!registros) {
            console.log("Nenhum registro encontrado para o relatório");
            alert("Nenhum registro encontrado.");
            tabela.innerHTML = '<tr><td colspan="10" class="text-center p-4">Nenhum registro encontrado</td></tr>';
            return;
          }

          let mensagem = `📋 *Relatório Geral - CDC Barueri*\n\n`;
          Object.values(registros).forEach((r, i) => {
            console.log("Processando registro para relatório:", r);
            mensagem += `🔹 *Registro ${i + 1}:*\n`;
            mensagem += `FMO: ${r.fmo || 'Não informado'}\n`;
            mensagem += `Nome: ${r.motorista || 'Não informado'}\n`;
            mensagem += `Placa: ${r.placa || 'Não informada'}\n`;
            mensagem += `Hora: ${r.dataHora || 'Não informada'}\n`;
            mensagem += `Endereço: ${r.enderecoCompleto || 'Carregando...'}\n`;
            mensagem += `Doca: ${r.docaSelecionada || 'Não informada'}\n`;
            mensagem += `Status: ${r.status || statuses[0]}\n\n`;
          });

          console.log("Mensagem do relatório gerada:", mensagem);
          const link = `https://wa.me/?text=${encodeURIComponent(mensagem)}`;
          console.log("Abrindo link do relatório no WhatsApp:", link);
          window.open(link, "_blank");

          Object.keys(registros).forEach(id => {
            if (registros[id].status === "Descarga finalizada") {
              console.log("Removendo registro finalizado:", id);
              remove(ref(database, `registrosFMO/${id}`)).catch(error => {
                console.error("Erro ao remover registro:", error);
              });
            }
          });
        }, { onlyOnce: true }, error => {
          console.error("Erro ao gerar relatório:", error);
          alert("Erro ao gerar relatório: " + error.message);
        });
      }

      btnRelatorioGeral.addEventListener('click', () => {
        console.log("Botão Enviar Relatório Geral clicado");
        enviarRelatorioGeral();
      });

      populateTable();
    });
  </script>
</body>
