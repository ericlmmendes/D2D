<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="pt-BR">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    video, canvas {
      width: 100%;
      max-width: 400px;

      background-color: #2563eb;

      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;

      background: white;
      padding: 1.5rem;
      max-width: 90%;

      border-radius: 0.75rem;
      box-shadow: 0 10px 15px rgba(0,0,0,0.2);

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }

    @keyframes fadeIn {

        max-width: 100%;

</head>
<body class="bg-gray-50 min-h-screen">
  <header class="header">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <i class="fas fa-camera text-2xl"></i>
      <h1 class="text-2xl font-bold">Cadastro D2D - CDC Barueri</h1>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 mt-6">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-auto">
      <form id="registroForm" class="space-y-4">
        <div class="input-group">
          <label for="motorista"><i class="fas fa-user mr-1"></i>Nome do Motorista</label>
          <input type="text" id="motorista" placeholder="Digite o nome do motorista" required
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="input-group">
          <label for="telefone"><i class="fas fa-phone mr-1"></i>Telefone</label>
          <input type="tel" id="telefone" placeholder="11999999999" required
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="input-group">
          <label for="fmo"><i class="fas fa-file-alt mr-1"></i>FM-O do Motorista</label>
          <input type="text" id="fmo" placeholder="Digite o FM-OXXXCDC" required
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="input-group">
          <label for="placa"><i class="fas fa-truck mr-1"></i>Placa do Carro</label>
          <input type="text" id="placa" placeholder="ABC1234 ou ABC1D23" required
                 class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <video id="video" autoplay playsinline class="hidden"></video>
        <div class="button-container">
          <button type="button" id="btnTirarFoto" class="round-button bg-blue-600 text-white hover:bg-blue-700 transition">
            <i class="fas fa-camera"></i>
          </button>
          <button type="button" id="btnVerRegistros" class="round-button bg-gray-600 text-white hover:bg-gray-700 transition hidden">
            <i class="fas fa-clipboard"></i>
          </button>
        </div>
        <canvas id="canvas" class="hidden"></canvas>
      </form>
    </div>
  </main>

  <button id="btnSalaEspera" class="floating-button" title="Acessar Sala de Espera">
    <i class="fas fa-clock"></i>
  </button>

  <div id="modalConfirmar" class="modal">
    <div class="modal-content">
      <h3 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-question-circle mr-2"></i>Confirmar Salvamento</h3>
      <p class="text-gray-700 mb-4">Deseja salvar as informações?</p>
      <div class="flex justify-end gap-2">
        <button id="btnCancelarModal" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition">
          <i class="fas fa-times mr-2"></i>Cancelar
        </button>
        <button id="btnConfirmarModal" class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-800 transition flex items-center gap-2 text-lg shadow-md">
          <i class="fas fa-check mr-2"></i>Salvar
          <span id="spinnerModal" class="spinner"></span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { database, ref, push } from './firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      console.log("Firebase database:", database);
      console.log("Firebase ref:", ref);
      console.log("Firebase push:", push);

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');
      const btnTirarFoto = document.getElementById('btnTirarFoto');
      const btnVerRegistros = document.getElementById('btnVerRegistros');
      const btnSalaEspera = document.getElementById('btnSalaEspera');
      const modalConfirmar = document.getElementById('modalConfirmar');
      const btnConfirmarModal = document.getElementById('btnConfirmarModal');
      const btnCancelarModal = document.getElementById('btnCancelarModal');
      const spinnerModal = document.getElementById('spinnerModal');

      // Evento para o botão Sala de Espera
      btnSalaEspera.addEventListener('click', () => {
        console.log("Botão Sala de Espera clicado");
        window.open("sala_espera.html", "_blank");
      });

      function camposPreenchidos() {
        const motorista = document.getElementById("motorista").value.trim();
        const telefone = document.getElementById("telefone").value.trim();
        const fmo = document.getElementById("fmo").value.trim();
        const placa = document.getElementById("placa").value.trim();
        return motorista && telefone && fmo && placa;
      }

      btnTirarFoto.onclick = () => {
        if (!camposPreenchidos()) {
          alert("Por favor, preencha todos os campos antes de tirar a foto.");
          return;
        }

        console.log("Iniciando câmera...");
        video.classList.remove('hidden');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            video.srcObject = stream;
            video.play();
            console.log("Câmera iniciada com sucesso");
            video.oncanplay = () => {
              console.log("Vídeo pronto para captura");
              setTimeout(tirarFoto, 2000);
            };
          })
          .catch(err => {
            console.error("Erro ao acessar câmera:", err);
            alert("Erro ao acessar câmera: " + err.message);
            video.classList.add('hidden');
          });
      };

      function tirarFoto() {
        console.log("Tentando tirar foto...");
        if (video.videoWidth === 0 || video.videoHeight === 0) {
          console.error("Câmera não pronta: videoWidth ou videoHeight é 0");
          alert("A câmera ainda não está pronta, tente novamente.");
          video.classList.add('hidden');
          return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        console.log("Foto capturada com sucesso");
        canvas.classList.remove('hidden');
        video.classList.add('hidden');

        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
          console.log("Stream da câmera encerrado");
        }

        // Abrir modal de confirmação após tirar a foto
        console.log("Abrindo modal de confirmação");
        modalConfirmar.style.display = 'flex';
      }

      btnVerRegistros.addEventListener('click', () => {
        console.log("Tentando abrir registros.html");
        window.open("registros.html", "_blank");
      });

      // Fechar modal ao clicar em Cancelar
      btnCancelarModal.addEventListener('click', () => {
        console.log("Botão Cancelar clicado");
        modalConfirmar.style.display = 'none';
      });

      // Confirmar salvamento no modal
      btnConfirmarModal.addEventListener('click', async () => {
        console.log("Botão Salvar (modal) clicado");
        spinnerModal.style.display = 'inline-block';
        btnConfirmarModal.disabled = true;
        btnCancelarModal.disabled = true;

        const motorista = document.getElementById("motorista").value.trim();
        const telefone = document.getElementById("telefone").value.trim();
        const fmo = document.getElementById("fmo").value.trim();
        const placa = document.getElementById("placa").value.trim();
        const dataHora = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });

        console.log("Dados do formulário:", { motorista, telefone, fmo, placa, dataHora });

        let latitude = '', longitude = '';
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject);
          });
          latitude = pos.coords.latitude.toFixed(6);
          longitude = pos.coords.longitude.toFixed(6);
          console.log("Geolocalização obtida:", { latitude, longitude });
        } catch (err) {
          console.warn("Erro na geolocalização:", err);
          alert("Localização não permitida. O registro será salvo sem coordenadas.");
        }

        const imagemBase64 = canvas.toDataURL("image/png");
        const novoRegistro = {
          motorista,
          telefone,
          fmo,
          placa,
          dataHora,
          latitude,
          longitude,
          imagem: imagemBase64,
          status: "Aguardando descarregamento"
        };

        console.log("Registro a ser salvo:", novoRegistro);

        try {
          if (!push || typeof push !== 'function') {
            throw new Error("Firebase push não está definido ou não é uma função");
          }
          await push(ref(database, 'registrosFMO'), novoRegistro);
          console.log("Registro salvo com sucesso no Firebase");
          alert("Registro salvo com sucesso! Redirecionando para a sala de espera...");
          document.getElementById("registroForm").reset();
          canvas.classList.add('hidden');
          modalConfirmar.style.display = 'none';
          window.location.href = "sala_espera.html";
        } catch (error) {
          console.error("Erro ao salvar no Firebase:", error);
          alert("Erro ao salvar o registro: " + error.message);
          spinnerModal.style.display = 'none';
          btnConfirmarModal.disabled = false;
          btnCancelarModal.disabled = false;
        }
      });

      window.onload = function () {
        const senha = prompt("Digite a senha de administrador para acesso total:");
        console.log("Senha digitada:", senha);
        if (senha === "Evo@0101") {
          console.log("Senha correta, mostrando botão Ver Registros");
          btnVerRegistros.classList.remove("hidden");
        } else {
          console.log("Senha incorreta");
        }
      };
    });
  </script>
</body>
</html>
